[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymodalshaker"
dynamic = ["version"]
description = "Shaker modal testing with NI CompactDAQ: random, stepped-sine, harmonic and phase-quadrature excitation (PySide6 + NI-DAQmx)"
readme = { file = "README.org", content-type = "text/plain" }
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "The pymodalshaker authors" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "numpy>=1.23",
    "scipy>=1.9",
    "nidaqmx>=0.9",
    "pyuff>=2.4",
    "npTDMS>=1.7",
]
keywords = ["modal testing", "shaker", "FRF", "stepped sine", "phase resonance", "NI-DAQmx", "CompactDAQ",
            "vibration", "nonlinear dynamics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Nidish96/pymodalshaker"
Issues = "https://github.com/Nidish96/pymodalshaker/issues"

[project.gui-scripts]
pymodalshaker = "pymodalshaker.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "pymodalshaker.__version__" }

[tool.setuptools.packages.find]
include = ["pymodalshaker*"]
